<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <!-- iPhone: richtige Breite, Inhalt bis in die Ecken (Notch/Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Bierball Zähler</title>

  <!-- Als App auf dem Home-Bildschirm (ohne Safari-Leisten) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bierball Zähler">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <div class="kasten">
      <h1 class="ueberschrift">Bierball Zähler</h1>
    </div>

    <!-- Zählerstand, wird live aus Firestore befüllt -->
    <p id="zahl" class="zahl" aria-live="polite">–</p>

    <button id="plus" class="plus" type="button" disabled>+1</button>

    <!-- Hinweise wie „Offline“ oder „Wird gespeichert …“ -->
    <p id="status" class="status" role="status"></p>
  </main>

  <!-- Modul, weil das Firebase SDK per import() geladen wird -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
