<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .linie { fill: none; stroke: #555; stroke-width: 1.5; }
    .spieler { fill: #000; }
    .text { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .linie { stroke: #aaa; }
      .spieler, .text { fill: #fff; }
    }
  </style>

  <!-- Startlinie A, Mittellinie, Startlinie B -->
  <rect class="linie" x="80" y="10" width="240" height="140"/>
  <line class="linie" x1="200" y1="10" x2="200" y2="150"/>

  <!-- Team A -->
  <circle class="spieler" cx="62" cy="35" r="5"/>
  <circle class="spieler" cx="62" cy="80" r="5"/>
  <circle class="spieler" cx="62" cy="125" r="5"/>
  <text class="text" x="38" y="85">A</text>

  <!-- Team B -->
  <circle class="spieler" cx="338" cy="35" r="5"/>
  <circle class="spieler" cx="338" cy="80" r="5"/>
  <circle class="spieler" cx="338" cy="125" r="5"/>
  <text class="text" x="352" y="85">B</text>

  <!-- Standflasche F -->
  <circle cx="200" cy="80" r="7" fill="#6b9bd8"/>
  <text class="text" x="210" y="66">F</text>
</svg>
